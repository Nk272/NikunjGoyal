<!-- ABOUTME: Main landing page for Nikunj Goyal's portfolio -->
<!-- ABOUTME: Single-viewport layout with animated bezier life curve and light/dark theme toggle -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nikunj Goyal</title>
  <meta name="description" content="Portfolio of Nikunj Goyal">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Hanken+Grotesk:wght@300..800&family=JetBrains+Mono:wght@300..600&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <script>var t = localStorage.getItem('theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme:light)').matches ? 'light' : 'dark'); document.documentElement.setAttribute('data-theme', t);</script>
  <style>
    html,
    body {
      height: 100%;
      overflow: hidden
    }

    body {
      display: flex;
      flex-direction: column
    }

    /* ---- INFO STRIP ---- */
    .info-strip {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px clamp(20px, 4vw, 44px);
      background: transparent;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }

    .info-strip .info-item {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: .1em;
      color: var(--muted);
      padding: 0 22px;
      border-right: 1px solid var(--line);
    }

    .info-strip .info-item:last-child {
      border-right: none
    }

    .info-strip .info-item b {
      color: var(--accent);
      font-weight: 500
    }

    .info-strip .info-item i {
      color: var(--handle);
      font-style: normal
    }

    /* ---- MAIN CONTENT ---- */
    .main-content {
      position: relative;
      z-index: 2;
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      align-items: center;
      padding: 0 clamp(28px, 5vw, 60px);
      min-height: 0;
    }

    /* ---- QUOTE ---- */
    .quote-side {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-right: 48px;
    }

    .quote-mark {
      font-family: var(--font-display);
      font-size: 72px;
      line-height: 1;
      color: var(--accent);
      opacity: .35;
    }

    h1.quote-text {
      font-family: var(--font-display);
      font-style: italic;
      font-size: clamp(22px, 3vw, 38px);
      font-weight: 340;
      line-height: 1.25;
      letter-spacing: -.01em;
      margin-top: -10px;
    }

    .quote-attr {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: .14em;
      color: var(--faint);
      margin-top: 24px;
      text-transform: uppercase;
    }

    .quote-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px
    }

    .qt {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: .08em;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 4px 10px;
    }

    .qt.hot {
      color: var(--accent);
      border-color: rgba(255, 90, 60, .35)
    }

    .quote-cta {
      display: flex;
      gap: 12px;
      margin-top: 28px;
      flex-wrap: wrap
    }

    /* ---- CURVE STAGE ---- */
    .curve-side {
      position: relative;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 0;
    }

    .stage {
      position: relative;
      width: 100%;
      height: 78%;
      max-height: 480px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: linear-gradient(160deg, var(--ink-2), var(--ink));
      overflow: hidden;
      box-shadow: 0 40px 80px -40px rgba(0, 0, 0, .8);
    }

    [data-theme="light"] .stage {
      box-shadow: 0 40px 80px -40px rgba(0, 0, 0, .12)
    }

    .stage .hud {
      position: absolute;
      top: 12px;
      left: 14px;
      z-index: 3;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: .12em;
      color: var(--faint);
    }

    .stage .hud2 {
      position: absolute;
      bottom: 12px;
      right: 14px;
      z-index: 3;
      text-align: right;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: .1em;
      color: var(--faint);
    }

    .stage svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%
    }

    /* milestone SVG text */
    .ms-label {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: .06em;
      fill: var(--text);
      opacity: .8
    }

    .ms-year {
      font-family: var(--font-mono);
      font-size: 8px;
      letter-spacing: .1em;
      fill: var(--handle)
    }

    .ms-dot {
      fill: var(--accent)
    }

    .ms-ring {
      fill: none;
      stroke: var(--accent);
      stroke-width: 1.5;
      opacity: .2
    }

    @media (max-width: 880px) {

      html,
      body {
        height: auto;
        overflow: auto
      }

      .main-content {
        grid-template-columns: 1fr;
        padding: 30px clamp(20px, 4vw, 44px) 40px
      }

      .quote-side {
        padding-right: 0
      }

      .curve-side {
        height: 60vw;
        min-height: 300px
      }
    }

    @media (max-width: 480px) {
      .info-strip {
        flex-wrap: wrap;
        gap: 4px
      }

      .info-strip .info-item {
        border-right: none;
        padding: 3px 10px
      }
    }

    .footer-sig {
      position: fixed;
      bottom: 16px;
      left: 0;
      right: 0;
      z-index: 2;
      text-align: center;
      pointer-events: none;
    }

    .footer-sig span {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 14px;
      color: var(--faint);
      opacity: .6;
    }

    /* ---- CONTACT DROPDOWN ---- */
    .contact-wrap {
      position: relative;
    }

    .contact-trigger {
      background: none;
      border: none;
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: .08em;
      color: var(--muted);
      transition: color .25s;
      padding: 0;
    }

    .contact-trigger:hover {
      color: var(--text);
    }

    .contact-drop {
      position: absolute;
      top: calc(100% + 14px);
      right: 50%;
      transform: translateX(50%);
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
      z-index: 60;
    }

    .contact-drop.open {
      pointer-events: auto;
    }

    .contact-circle {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--ink-2);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transform: translateY(-10px) scale(0.5);
      transition: opacity .25s, transform .3s cubic-bezier(.34,1.56,.64,1), border-color .25s, background .25s;
      text-decoration: none;
    }

    .contact-drop.open .contact-circle {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .contact-drop.open .contact-circle:nth-child(1) { transition-delay: 0s; }
    .contact-drop.open .contact-circle:nth-child(2) { transition-delay: .05s; }
    .contact-drop.open .contact-circle:nth-child(3) { transition-delay: .1s; }
    .contact-drop.open .contact-circle:nth-child(4) { transition-delay: .15s; }

    .contact-circle:hover {
      border-color: var(--accent);
      background: var(--ink-3);
      transform: translateY(-3px) scale(1.08);
    }

    .contact-circle svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: var(--muted);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke .25s;
    }

    .contact-circle:hover svg {
      stroke: var(--accent);
    }
  </style>
</head>

  <div class="info-strip">

  <div class="main-content">
    <div class="quote-side">
      <div class="quote-mark">"</div>
      <h1 class="quote-text">One often meets his destiny on the road he takes to avoid it.</h1>
      <div class="quote-attr">— Master Oogway</div>
      <div class="quote-cta">
        <a class="btn primary" href="journey.html" target="_blank">trace the curve &#8594;</a>
      </div>

    <div class="curve-side">
      <div class="stage" id="stage">
        <div class="hud">LIFE CURVE</div>

        <svg viewBox="0 0 600 410" id="bez" preserveAspectRatio="xMidYMid meet">
          <defs>
            <linearGradient id="curveGrad" x1="0" y1="1" x2="1" y2="0">
              <stop offset="0" stop-color="var(--handle)" />
              <stop offset="1" stop-color="var(--accent)" />
            </linearGradient>
          </defs>
          <path id="curveShadow" fill="none" stroke="url(#curveGrad)" stroke-width="8" stroke-linecap="round"
            opacity=".12" />
          <path id="curve" fill="none" stroke="url(#curveGrad)" stroke-width="2.5" stroke-linecap="round" />
          <g id="milestones"></g>
        </svg>
      </div>
    </div>

  <div class="footer-sig"><span>— anchored, not fixed.</span></div>

  <script>
    (function () {
      // ---- contact dropdown ----
      var contactBtn = document.getElementById('contactToggle');
      var contactDrop = document.getElementById('contactDrop');
      contactBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        contactDrop.classList.toggle('open');
      });
      document.addEventListener('click', function (e) {
        if (!contactDrop.contains(e.target) && e.target !== contactBtn) {
          contactDrop.classList.remove('open');
        }
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') contactDrop.classList.remove('open');
      });

      var SVG_NS = 'http://www.w3.org/2000/svg';

      // ---- theme toggle ----
      var toggle = document.getElementById('themeToggle');
      var root = document.documentElement;
      UpdateToggleText();
      toggle.addEventListener('click', function () {
        var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        root.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        UpdateToggleText();
      });
      function UpdateToggleText() {
        toggle.textContent = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      }

      // ---- live age from 8 Oct 2001 ----
      var BIRTH = new Date(2001, 9, 8);
      var ageEl = document.getElementById('ageDisplay');
      function CalcAge() {
        var now = new Date();
        var y = now.getFullYear() - BIRTH.getFullYear();
        var m = now.getMonth() - BIRTH.getMonth();
        var d = now.getDate() - BIRTH.getDate();
        if (d < 0) { m--; d += new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
        if (m < 0) { y--; m += 12; }
        ageEl.innerHTML = '<b>' + y + '</b>y <b>' + m + '</b>m <b>' + d + '</b>d';
      }
      CalcAge();
      setInterval(CalcAge, 1000);

      // ---- sin(x)*e^x curve with milestones ----
      var svgEl = document.getElementById('bez');
      var curvePath = document.getElementById('curve');
      var curveShadow = document.getElementById('curveShadow');
      var msGroup = document.getElementById('milestones');

      var PAD = 40;
      var W = 600;
      var H = 410;
      var STEPS = 200;

      // x range chosen so the curve fits nicely
      var X_MIN = -1.0;
      var X_MAX = 2.2;

      function CurveFunc(x) {
        return Math.sin(x) * Math.exp(x);
      }

      // precompute y range for normalization
      var yMin = Infinity, yMax = -Infinity;
      for (var i = 0; i <= STEPS; i++) {
        var xv = X_MIN + (X_MAX - X_MIN) * i / STEPS;
        var yv = CurveFunc(xv);
        if (yv < yMin) yMin = yv;
        if (yv > yMax) yMax = yv;
      }

      function MapToSvg(xv, yv) {
        var sx = PAD + (xv - X_MIN) / (X_MAX - X_MIN) * (W - 2 * PAD);
        var sy = (H - PAD) - (yv - yMin) / (yMax - yMin) * (H - 2 * PAD);
        return { x: sx, y: sy };
      }

      // milestones placed at fixed x positions along the curve
      var milestoneData = [
        { label: 'Highschool', t: 0.0, above: true },
        { label: 'JEE', t: 0.18, above: false },
        { label: 'IIT Roorkee', t: 0.35, above: true },
        { label: 'Adobe', t: 0.52, above: false },
        { label: 'CNCF US', t: 0.68, above: true },
        { label: 'Amazon', t: 0.84, above: false },
        { label: 'Next...', t: 1.0, above: true }
      ];

      milestoneData.forEach(function (ms) {
        var g = document.createElementNS(SVG_NS, 'g');

        var ring = document.createElementNS(SVG_NS, 'circle');
        ring.setAttribute('r', '12');
        ring.setAttribute('class', 'ms-ring');
        g.appendChild(ring);

        var dot = document.createElementNS(SVG_NS, 'circle');
        dot.setAttribute('r', '4');
        dot.setAttribute('class', 'ms-dot');
        g.appendChild(dot);

        var label = document.createElementNS(SVG_NS, 'text');
        label.setAttribute('class', 'ms-label');
        label.setAttribute('dy', ms.above ? -14 : 20);
        label.setAttribute('text-anchor', 'middle');
        label.textContent = ms.label;
        g.appendChild(label);

        ms.el = g;
        msGroup.appendChild(g);
      });

      function BuildCurvePath(phase) {
        var d = '';
        for (var i = 0; i <= STEPS; i++) {
          var xv = X_MIN + (X_MAX - X_MIN) * i / STEPS;
          var yv = CurveFunc(xv);
          // subtle wave animation
          yv += Math.sin(xv * 3 + phase) * 0.15;
          var pt = MapToSvg(xv, yv);
          d += (i === 0 ? 'M' : 'L') + pt.x.toFixed(2) + ' ' + pt.y.toFixed(2);
        }
        return d;
      }

      function Render(phase) {
        var d = BuildCurvePath(phase);
        curvePath.setAttribute('d', d);
        curveShadow.setAttribute('d', d);

        milestoneData.forEach(function (ms) {
          var xv = X_MIN + (X_MAX - X_MIN) * ms.t;
          var yv = CurveFunc(xv);
          yv += Math.sin(xv * 3 + phase) * 0.15;
          var pt = MapToSvg(xv, yv);
          ms.el.setAttribute('transform', 'translate(' + pt.x.toFixed(2) + ',' + pt.y.toFixed(2) + ')');
        });
      }

      var time = 0;
      function Loop() {
        time += 0.008;
        Render(time);
        requestAnimationFrame(Loop);
      }

      Render(0);
      Loop();
    })();
  </script>
